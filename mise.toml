[tools]
node = "24"

[tasks.test]
description = "Run the window model and background source tests"
run = "node --test tests/*.test.mjs"

[tasks.coverage]
description = "Run model tests with >=90% line/branch/function coverage enforced on WindowModel.js"
run = "node --test --experimental-test-coverage --test-coverage-include='**/WindowModel.js' --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=90 tests/*.test.mjs"

[tasks.lint]
description = "Validate plugin QML"
run = "/usr/lib/qt6/bin/qmllint -I /usr/share/omarchy/shell MissionControl.qml Service.qml BarWidget.qml"

[tasks.check]
description = "Run every repository check"
depends = ["coverage", "lint"]

[tasks.visual-build]
description = "Build the Wayland input helper for live interaction tests"
run = "mkdir -p .build && cc -O2 -Wall -Wextra -Werror -o .build/mc-uinput tests/live/mc-uinput.c"

[tasks.visual-test]
description = "Exercise Mission Control interactions and generate visual evidence"
depends = ["visual-build"]
run = "MC_UINPUT=.build/mc-uinput node tests/live/run.mjs"
